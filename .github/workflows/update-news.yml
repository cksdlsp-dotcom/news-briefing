name: Update public news briefing

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0,3,6,9,12 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public news
        run: python scripts/fetch_news.py
      - name: Commit updates
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "자동 뉴스 브리핑 갱신"
          git push
