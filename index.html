<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="theme-color" content="#006461"><title>건축 브리핑</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f1;color:#1d2a2a;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.app{max-width:900px;margin:auto}.top{position:sticky;top:0;z-index:5;background:#f7f9f9;border-bottom:1px solid #d8dede;padding:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:22px;margin:0}.datewrap{position:relative;display:inline-flex}.datebtn{border:1px solid #d8dede;background:#fff;color:#546363;border-radius:8px;padding:7px 9px;font-size:12px}.dateinput{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}.bar{background:#2d746e;color:#fff;padding:10px 14px;font-size:12px;line-height:1.5}.tools{display:flex;gap:7px;padding:10px 12px;background:#f7f9f9;border-bottom:1px solid #d8dede;overflow-x:auto;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool{flex:0 0 auto;border:1px solid #cfd7d7;background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#546363;cursor:pointer}.tool.active{background:#2d746e;color:#fff}.summary{margin:12px;background:#fff;border:1px solid #d8dede;border-radius:12px;padding:11px 13px;font-size:12px;color:#667474;line-height:1.5}.feed{padding:0 12px 18px}.card{background:#fff;border:1px solid #d8dede;border-radius:12px;margin-bottom:10px;padding:13px}.card.read{background:#e3e7e7;color:#788181}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.projects{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}.tag{font-size:10px;font-weight:900;color:#2d746e;background:#eef5f4;border:1px solid #d6e4e2;border-radius:999px;padding:4px 7px}.actions{display:flex;gap:2px}.iconbtn{border:0;background:transparent;font-size:21px;color:#a8b3b2;padding:0 3px;cursor:pointer}.iconbtn.on{color:#2d746e}.titlelink{text-decoration:none;color:inherit}.title{font-size:16px;line-height:1.45;font-weight:900;margin:0 0 8px}.mark{font-size:12px;line-height:1.5;color:#536261;margin:5px 0 9px}.mark b{color:#2d746e}.meta{font-size:11px;color:#879292;display:flex;justify-content:space-between;gap:8px}.origin{font-weight:800}.via{font-size:10px;color:#9aa4a3}.memo{margin-top:10px;border-top:1px solid #e2e7e7;padding-top:9px}.memo textarea{width:100%;min-height:62px;resize:vertical;border:1px solid #d8dede;border-radius:8px;padding:8px;font:inherit;font-size:12px;background:#fbfcfc}.restorebox{margin:0 12px 12px;background:#fff8e9;border:1px solid #e3cf9b;border-radius:10px;padding:10px 12px;font-size:12px;display:none}.restorebox button{border:0;background:#2d746e;color:white;border-radius:7px;padding:6px 9px;font-weight:800;margin-left:8px}.empty{text-align:center;color:#83908f;padding:28px 12px;font-size:13px}.footer{padding:0 12px 18px;font-size:11px;color:#758181;line-height:1.5}@media(min-width:700px){.feed{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{margin:0}}</style></head><body><div class="app"><div class="top"><div class="row"><h1>▰ 건축 브리핑</h1><div class="datewrap"><button class="datebtn" id="dateBtn"></button><input class="dateinput" id="datePicker" type="date"></div></div></div><div class="bar">공개 접근 가능한 뉴스·전문지·정책자료를 폭넓게 수집해 프로젝트 관련 기사만 선별합니다. 제목=원문 · ☆ 스크랩 · × 관심없음</div><div class="tools" id="tools"></div><div class="summary" id="summary">불러오는 중…</div><div class="restorebox" id="restoreBox">방금 제외: <b id="restoreTitle"></b><button id="undoDismiss">되돌리기</button></div><main class="feed" id="feed"></main><div class="empty" id="empty" style="display:none">해당 날짜·조건의 기사가 없습니다.</div><div class="footer">읽음·스크랩·관심없음·메모는 이 기기 브라우저에 저장됩니다. 유료·로그인·접근차단 자료는 수집 대상에서 제외합니다.</div></div><script>
const PROJECTS=['수주대박','사전검토','문서분류','감리자동화','내역·적산','BIM','AI활용','QGIS자동화','지역·부동산'];
const toolsEl=document.getElementById('tools'),feed=document.getElementById('feed'),picker=document.getElementById('datePicker'),btn=document.getElementById('dateBtn'),days=['일','월','화','수','목','금','토'];
let articles=[],filter='all',lastDismissed=null,saved=new Set(JSON.parse(localStorage.getItem('briefScraps')||'[]')),read=new Set(JSON.parse(localStorage.getItem('briefRead')||'[]')),dismissed=new Set(JSON.parse(localStorage.getItem('briefDismissed')||'[]'));
function store(){localStorage.setItem('briefScraps',JSON.stringify([...saved]));localStorage.setItem('briefRead',JSON.stringify([...read]));localStorage.setItem('briefDismissed',JSON.stringify([...dismissed]))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function label(v){const[y,m,d]=v.split('-').map(Number),dt=new Date(y,m-1,d);btn.textContent=`${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')} ${days[dt.getDay()]} ▾`}
function makeTools(){toolsEl.innerHTML=`<button class="tool active" data-filter="all">전체 <span data-count="all"></span></button>`+PROJECTS.map(p=>`<button class="tool" data-filter="${p}">${p} <span data-count="${p}"></span></button>`).join('')+`<button class="tool" data-filter="scrap">★ 스크랩 <span id="scrapCount">0</span></button><button class="tool" data-filter="dismissed">↶ 관심없음 <span id="dismissCount">0</span></button>`;[...toolsEl.querySelectorAll('.tool')].forEach(t=>t.onclick=()=>{[...toolsEl.querySelectorAll('.tool')].forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.filter;render()})}
function selected(){const d=picker.value;return articles.filter(a=>{if(a.briefing_date!==d)return false;if(filter==='scrap')return saved.has(a.id);if(filter==='dismissed')return dismissed.has(a.id);if(dismissed.has(a.id))return false;if(filter!=='all'&&!(a.projects||[]).includes(filter))return false;return true})}
function counts(){const d=picker.value,base=articles.filter(a=>a.briefing_date===d&&!dismissed.has(a.id));const all=document.querySelector('[data-count="all"]');if(all)all.textContent=base.length;PROJECTS.forEach(p=>{const e=document.querySelector(`[data-count="${p}"]`);if(e)e.textContent=base.filter(a=>(a.projects||[]).includes(p)).length});document.getElementById('scrapCount').textContent=articles.filter(a=>a.briefing_date===d&&saved.has(a.id)).length;document.getElementById('dismissCount').textContent=articles.filter(a=>a.briefing_date===d&&dismissed.has(a.id)).length}
function card(a){const tags=(a.projects||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join('');const via=a.via_google_news?` <span class="via">· 공개 뉴스 경유</span>`:'';return `<article class="card ${read.has(a.id)?'read':''}" data-id="${esc(a.id)}"><div class="head"><div class="projects">${tags}</div><div class="actions"><button class="iconbtn scrap ${saved.has(a.id)?'on':''}" title="스크랩">${saved.has(a.id)?'★':'☆'}</button><button class="iconbtn dismiss" title="관심없음">×</button></div></div><a class="titlelink" target="_blank" rel="noopener" href="${esc(a.url)}"><h2 class="title">${esc(a.title)}</h2></a><div class="mark"><b>◆</b> ${esc(a.mark||'')}</div><div class="meta"><span class="origin">${esc(a.source)}${via}</span><span>${esc(a.published_date||a.briefing_date)}</span></div><div class="memo"><textarea placeholder="원문에서 남길 문장이나 내 생각을 붙여넣기">${esc(localStorage.getItem('briefMemo:'+a.id)||'')}</textarea></div></article>`}
function bind(){[...feed.querySelectorAll('.card')].forEach(c=>{const id=c.dataset.id,a=articles.find(x=>x.id===id);c.querySelector('.titlelink').onclick=()=>{read.add(id);store();c.classList.add('read')};c.querySelector('.scrap').onclick=e=>{e.preventDefault();saved.has(id)?saved.delete(id):saved.add(id);store();render()};c.querySelector('.dismiss').onclick=e=>{e.preventDefault();dismissed.add(id);lastDismissed=id;store();document.getElementById('restoreTitle').textContent=a.title;document.getElementById('restoreBox').style.display='block';render()};const ta=c.querySelector('textarea');ta.oninput=()=>localStorage.setItem('briefMemo:'+id,ta.value)})}
function render(){counts();const list=selected();feed.innerHTML=list.map(card).join('');document.getElementById('empty').style.display=list.length?'none':'block';bind()}
document.getElementById('undoDismiss').onclick=()=>{if(lastDismissed){dismissed.delete(lastDismissed);store();lastDismissed=null;document.getElementById('restoreBox').style.display='none';render()}};
picker.onchange=()=>{label(picker.value);render()};
makeTools();fetch('news.json?ts='+Date.now()).then(r=>r.json()).then(data=>{articles=data.articles||[];const dates=[...new Set(articles.map(a=>a.briefing_date).filter(Boolean))].sort();const latest=dates.at(-1)||new Date().toISOString().slice(0,10);picker.value=latest;picker.max=latest;picker.min=dates[0]||latest;label(latest);document.getElementById('summary').textContent=`◆ ${latest} 선별 기사 ${articles.filter(a=>a.briefing_date===latest).length}건 · 마지막 수집 ${data.updated_at?data.updated_at.replace('T',' ').slice(0,16):'-'} · 같은 제목은 중복 제거`;render()}).catch(()=>{document.getElementById('summary').textContent='뉴스 데이터를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';document.getElementById('empty').style.display='block'});
</script></body></html>
